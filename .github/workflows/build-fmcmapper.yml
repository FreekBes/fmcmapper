name: Build fmcmapper image

# Reusable build definition for the tiling service image (root Dockerfile).
# Callers decide whether the built image is pushed to GHCR:
#   - test-fmcmapper.yml    (pull_request) calls with push: false — build only
#   - release-fmcmapper.yml (push master)  calls with push: true  — build + push
# Permissions and concurrency are set by the caller.
on:
  workflow_call:
    inputs:
      push:
        description: 'Push the built image to GHCR (false = build only)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The renderer targets a specific Minecraft version (TARGET_VERSION in
      # gamedata.ts); the image is tagged after it. GHCR image names must be
      # lowercase, so build the image reference here.
      - name: Resolve version and image
        id: ver
        run: |
          ver="$(grep -oP "TARGET_VERSION = '\K[^']+" src/gamedata.ts)"
          [ -n "$ver" ] || { echo "could not read TARGET_VERSION from src/gamedata.ts" >&2; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fmcmapper" >> "$GITHUB_OUTPUT"

      # Single source for OCI labels AND annotations. created / revision / source /
      # licenses are filled in automatically; we override title / description /
      # version. Tags: moving :latest and :<mcver>, plus an immutable
      # :<mcver>-<run_number> for rollback. Annotations are emitted at the image
      # index level, which is where GHCR reads the package description.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ steps.ver.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.version }}-${{ github.run_number }}
          labels: |
            org.opencontainers.image.title=fmcmapper
            org.opencontainers.image.description=Renders a Minecraft world into an in-game-map-styled web map and serves it over HTTP (built-in nginx). Docs: github.com/FreekBes/fmcmapper
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      # Only log in when we intend to push. On pull_request (build-only), and on
      # fork PRs where GITHUB_TOKEN is read-only, this step is skipped.
      - uses: docker/login-action@v3
        if: ${{ inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Distinct cache scope per image — the default scope is shared, so two
          # images building concurrently would clobber each other's GHA cache.
          cache-from: type=gha,scope=fmcmapper
          cache-to: type=gha,scope=fmcmapper,mode=max
